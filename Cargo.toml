[workspace]
members = ["ide/src-tauri"]

[package]
name = "talea"
version = "0.1.0"
edition = "2024"

[lib]
name = "talea"
path = "src/lib.rs"

[[bin]]
name = "talea"
path = "src/main.rs"


[dependencies]
# ── Core interpreter ──────────────────────────────────────────────────────────
pyo3 = { version = "0.22.1", features = ["auto-initialize"] }
extendr-api    = { version = "0.8.0", optional = true }
extendr-engine = { version = "0.8.0", optional = true }
jni            = "0.21.0"
shellexpand    = "3.1.0"
rustyline      = "12"

# ── Serialisation ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── HTTP / OpenAI ─────────────────────────────────────────────────────────────
reqwest = { version = "0.12", features = ["blocking", "json"] }

# ── Text / regex ──────────────────────────────────────────────────────────────
regex = "1.10"

# ── Parallelism ───────────────────────────────────────────────────────────────
# rayon: data-parallel iterators (parallel map / for each)
rayon = "1.10"
# crossbeam: bounded channels for producer-consumer pipelines
crossbeam-channel = "0.5"

# ── Async runtime (needed by sqlx and AWS SDK) ────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Database ──────────────────────────────────────────────────────────────────
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "json",
], optional = true }

# ── Memory management ─────────────────────────────────────────────────────────
# bumpalo: fast arena allocator for large text workloads
bumpalo = "3.16"

[features]
default = []
# Enable support for the R backend through extendr.
r = ["extendr-api", "extendr-engine"]
# Enable PostgreSQL + MySQL + SQLite via sqlx.
db = ["sqlx"]


[build-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
zip = "2.1"
tar = "0.4"
flate2 = "1.0"
# FIX: Added the zstd crate for decompression
zstd = "0.13"



# Metadata for creating the macOS .app bundle
[package.metadata.bundle]
name = "Talea"
identifier = "com.insightslib.talea" # <-- IMPORTANT: Change this
icon = ["assets/icon.icns"]        # You need to create this file
version = "0.2.0"
copyright = "Copyright (c) Your Name 2025. All rights reserved."
category = "public.app-category.education"
short_description = "A plain-language NLP environment for the humanities."
resources = ["target/release/python-embedded"]
signing_identity = "-"

# Metadata for creating the Windows .msi installer
[package.metadata.wix]
upgrade-guid = "f64665b6-56fb-4fb9-ab08-e840dc801eaa" 
path-guid = "cd556aa4-8d01-487e-b525-f059fe657ee4"    
license = "LICENSE.txt"                                # You need to create this file
product-icon = "assets/icon.ico"                       # You need to create this file
