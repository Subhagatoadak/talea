[package]
name = "talea-ide"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1", features = ["custom-protocol", "dialog-open", "dialog-save", "fs-read-file", "fs-write-file"] }
talea = { path = "../../" }

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
